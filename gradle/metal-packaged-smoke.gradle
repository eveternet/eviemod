// Packaged fixtures deliberately omit the addon's compiled output: Fabric must load its distribution JAR.
import groovy.json.JsonSlurper

def target = minecraftVersion.toString()
def isMacHost = System.getProperty('os.name').toLowerCase(Locale.ROOT).startsWith('mac')
def packagedClasspath = sourceSets.smokeTest.runtimeClasspath - sourceSets.main.output
def clientClasspath = packagedClasspath.filter { !it.name.startsWith('lwjgl-shaderc-') && !it.name.startsWith('lwjgl-spvc-') }
def jarProvider = tasks.named('jar', Jar).flatMap { it.archiveFile }
def assets = new File(gradle.gradleUserHomeDir, 'caches/fabric-loom/assets')
def manifest = new File(gradle.gradleUserHomeDir, "caches/fabric-loom/${target}/mojang_minecraft_info.json")
def sodiumFiles = configurations.testRuntimeClasspath
def flavors = ['Vanilla', 'Sodium', 'Disabled', 'Fallback', 'Title']
if (target == '26.2') flavors += ['DisabledVulkan', 'PreflightFallback']
flavors.each { flavor ->
    tasks.register("packaged${flavor}Smoke", JavaExec) {
        group = 'verification'
        description = "Launch the packaged Minecraft ${target} Metal addon (${flavor.toLowerCase(Locale.ROOT)})"
        notCompatibleWithConfigurationCache('Fixture staging reads the resolved Sodium dependency and Mojang asset manifest at launch')
        dependsOn 'smokeTestClasses', 'jar', 'downloadAssets'
        classpath = clientClasspath
        javaLauncher = javaToolchains.launcherFor(java.toolchain)
        mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
        maxHeapSize = '2G'
        def game = layout.buildDirectory.dir("packagedSmoke/${flavor.toLowerCase(Locale.ROOT)}").get().asFile
        workingDir game
        jvmArgs '--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow'
        if (isMacHost) jvmArgs '-XstartOnFirstThread'
        systemProperty 'fabric.development', 'true'
        systemProperty 'fabric.defaultModDistributionNamespace', 'official'
        systemProperty 'fabric.defaultMixinRemapType', 'static'
        systemProperty 'fabric.classPathGroups', sourceSets.smokeTest.output.files.collect { it.absolutePath }.join(File.pathSeparator)
        systemProperty 'eviemod.metal.distributionExpected', 'true'
        if (flavor in ['Vanilla', 'Sodium', 'Title']) {
            systemProperty 'eviemod.metal.smokeExpected', 'true'
        }
        if (flavor in ['Vanilla', 'Sodium']) {
            systemProperty 'eviemod.metal.smokeExpected', 'true'
            systemProperty 'eviemod.metal.worldSmoke', 'true'
            systemProperty 'eviemod-metal.terrainProfile', 'true'
        }
        if (flavor in ['Disabled', 'DisabledVulkan']) systemProperty 'eviemod.metal', 'false'
        if (flavor == 'DisabledVulkan') {
            args '--graphicsBackend', 'vulkan'
            systemProperty 'eviemod.metal.expectedPreference', 'vulkan'
        }
        if (flavor == 'PreflightFallback') {
            systemProperty 'eviemod.metal.fixturePreflightFailure', 'true'
            systemProperty 'eviemod.metal.expectedPreference', 'opengl'
            args '--graphicsBackend', 'opengl'
        }
        doFirst {
            game.mkdirs()
            def mods = new File(game, 'mods'); mods.mkdirs()
            // Dedicated fixture directory; a version bump must never leave two copies of this mod installed.
            mods.listFiles().findAll { it.name.endsWith('.jar') }.each { it.delete() }
            java.nio.file.Files.copy(jarProvider.get().asFile.toPath(), new File(mods, jarProvider.get().asFile.name).toPath())
            if (flavor == 'Sodium') {
                def pinned = sodiumFiles.files.findAll { it.name == "sodium-mc${target}-0.9.2-fabric.jar" }
                if (pinned.size() != 1) throw new GradleException("Expected exact Sodium artifact for ${target}: ${pinned}")
                java.nio.file.Files.copy(pinned.first().toPath(), new File(mods, 'sodium.jar').toPath())
            }
            def index = new JsonSlurper().parse(manifest).assetIndex.id
            args '--gameDir', game.absolutePath, '--assetIndex', "${target}-${index}", '--assetsDir', assets.absolutePath,
                    '--version', target, '--username', 'MetalFixture', '--uuid', '00000000000000000000000000000008', '--accessToken', 'FabricMC'
        }
    }
}
if (target == '26.2') {
    tasks.register('packagedSurfaceSmoke', JavaExec) {
        group = 'verification'
        dependsOn 'smokeTestClasses', 'jar'
        classpath = packagedClasspath + files(jarProvider)
        javaLauncher = javaToolchains.launcherFor(java.toolchain)
        mainClass = 'dev.eviemod.metal.device.SurfaceSmoke'
        jvmArgs '-XstartOnFirstThread', '--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow'
    }
}
