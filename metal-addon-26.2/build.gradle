plugins {
    id 'net.fabricmc.fabric-loom'
}

ext.minecraftVersion = '26.2'

group = 'dev.eviemod'
version = '0.1.1.0'
base.archivesName = "eviemod-metal-mc${minecraftVersion}"
sourceSets.main.java.srcDir rootProject.file('metal-shared/src/main/java')

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    compileOnly "maven.modrinth:sodium:mc${minecraftVersion}-0.9.2-fabric"
    testImplementation "maven.modrinth:sodium:mc${minecraftVersion}-0.9.2-fabric"
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    // Match the LWJGL ABI shipped by Minecraft 26.1.2.
    ['lwjgl-shaderc', 'lwjgl-spvc'].each { module ->
        include implementation("org.lwjgl:${module}:3.4.1")
        include runtimeOnly("org.lwjgl:${module}:3.4.1:natives-macos-arm64")
        testRuntimeOnly "org.lwjgl:${module}:3.4.1:natives-linux"
    }
    testRuntimeOnly 'org.lwjgl:lwjgl:3.4.1:natives-linux'
    testRuntimeOnly 'org.lwjgl:lwjgl:3.4.1:natives-macos-arm64'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

if (providers.gradleProperty('metalSmokeTest').isPresent()) {
    sourceSets {
        smokeTest {
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
    }
    loom.mods {
        eviemod_metal { sourceSet sourceSets.main }
        eviemod_metal_smoke { sourceSet sourceSets.smokeTest }
    }
    tasks.named('runClient') {
        dependsOn tasks.named('smokeTestClasses')
        classpath += sourceSets.smokeTest.runtimeClasspath
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    testLogging { exceptionFormat = 'full' }
}
loom {
    runs.client {
        if (providers.gradleProperty('metal').isPresent()) {
            property 'eviemod.metal', providers.gradleProperty('metal').get() == 'false' ? 'false' : 'true'
        }
        if (providers.gradleProperty('metalWorldTest').isPresent()) property 'eviemod.metal.worldSmoke', 'true'
        if (providers.gradleProperty('terrainProfile').isPresent()) property 'eviemod-metal.terrainProfile', 'true'
        if (providers.gradleProperty('expectMetal').isPresent()) property 'eviemod.metal.smokeExpected', 'true'
    }
}


def isMac = System.getProperty('os.name').toLowerCase(Locale.ROOT).startsWith('mac')
def baseline = project(':metal-addon')
def nativeLibrary = baseline.layout.buildDirectory.file('native/libeviemod_metal.dylib')
def buildNative = ':metal-addon:buildNative'
processResources {
    dependsOn buildNative
    def addonVersion = project.version
    inputs.property 'version', addonVersion
    filesMatching('fabric.mod.json') { expand version: addonVersion, minecraftVersion: minecraftVersion }
    if (isMac) from(nativeLibrary) { into 'natives' }
}
jar { from('LICENSE'); from('NOTICE.md') }
sourcesJar { from(rootProject.file('metal-shared/src/main/native')) { into 'native' }; from('LICENSE'); from('NOTICE.md') }
// Distribution builds must contain the arm64 library; Linux builds exercise Java and fallback only.
tasks.register('verifyDistribution') {
    dependsOn jar
    def archive = jar.archiveFile
    doLast {
        def zip = new java.util.zip.ZipFile(archive.get().asFile)
        try {
            if (zip.getEntry('natives/libeviemod_metal.dylib') == null) {
                throw new GradleException('Build the distributable Metal addon on macOS (arm64 native missing).')
            }
        } finally { zip.close() }
    }
}
