plugins {
    id 'net.fabricmc.fabric-loom'
}

group = 'dev.eviemod'
version = '0.1.0.1'
base.archivesName = 'eviemod-metal'

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    compileOnly 'maven.modrinth:sodium:mc26.1.2-0.9.2-fabric'
    testImplementation 'maven.modrinth:sodium:mc26.1.2-0.9.2-fabric'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    // Match the LWJGL ABI shipped by Minecraft 26.1.2.
    ['lwjgl-shaderc', 'lwjgl-spvc'].each { module ->
        include implementation("org.lwjgl:${module}:3.4.1")
        include runtimeOnly("org.lwjgl:${module}:3.4.1:natives-macos-arm64")
        testRuntimeOnly "org.lwjgl:${module}:3.4.1:natives-linux"
    }
    testRuntimeOnly 'org.lwjgl:lwjgl:3.4.1:natives-linux'
    testRuntimeOnly 'org.lwjgl:lwjgl:3.4.1:natives-macos-arm64'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

if (providers.gradleProperty('metalSmokeTest').isPresent()) {
    sourceSets {
        smokeTest {
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
    }
    loom.mods {
        eviemod_metal { sourceSet sourceSets.main }
        eviemod_metal_smoke { sourceSet sourceSets.smokeTest }
    }
    tasks.named('runClient') {
        dependsOn tasks.named('smokeTestClasses')
        classpath += sourceSets.smokeTest.runtimeClasspath
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
def headers = layout.buildDirectory.dir('generated/jni')
tasks.withType(JavaCompile).configureEach { options.release = 25 }
compileJava { options.headerOutputDirectory = headers }
test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    testLogging { exceptionFormat = 'full' }
}
loom {
    runs.client {
        if (providers.gradleProperty('metal').isPresent()) {
            property 'eviemod.metal', providers.gradleProperty('metal').get() == 'false' ? 'false' : 'true'
        }
        if (providers.gradleProperty('metalWorldTest').isPresent()) property 'eviemod.metal.worldSmoke', 'true'
        if (providers.gradleProperty('terrainProfile').isPresent()) property 'eviemod-metal.terrainProfile', 'true'
        if (providers.gradleProperty('expectMetal').isPresent()) property 'eviemod.metal.smokeExpected', 'true'
    }
}

def isMac = System.getProperty('os.name').toLowerCase(Locale.ROOT).startsWith('mac')
def nativeLibrary = layout.buildDirectory.file('native/libeviemod_metal.dylib')
def compilerHome = javaToolchains.compilerFor(java.toolchain).map { it.metadata.installationPath }
def buildNative = tasks.register('buildNative', Exec) {
    dependsOn compileJava
    onlyIf { isMac }
    inputs.files(fileTree('src/main/native'), headers)
    inputs.property 'compilerHome', compilerHome.map { it.asFile.absolutePath }
    outputs.file nativeLibrary
    def output = nativeLibrary.get().asFile
    def headerDir = headers.get().asFile
    def source = file('src/main/native/eviemod_metal.mm')
    doFirst {
        output.parentFile.mkdirs()
        commandLine 'xcrun', 'clang++', '-std=c++20', '-fobjc-arc', '-O2',
            '-arch', 'arm64', '-mmacosx-version-min=14.0', '-dynamiclib',
            '-framework', 'Metal', '-framework', 'QuartzCore', '-framework', 'Cocoa',
            "-I${compilerHome.get()}/include", "-I${compilerHome.get()}/include/darwin",
            "-I${headerDir}", '-o', output.absolutePath, source.absolutePath
    }
}
processResources {
    dependsOn buildNative
    def addonVersion = project.version
    inputs.property 'version', addonVersion
    filesMatching('fabric.mod.json') { expand version: addonVersion }
    if (isMac) from(nativeLibrary) { into 'natives' }
}
jar { from('LICENSE'); from('NOTICE.md') }
sourcesJar { from('src/main/native') { into 'native' }; from('LICENSE'); from('NOTICE.md') }
// Distribution builds must contain the arm64 library; Linux builds exercise Java and fallback only.
tasks.register('verifyDistribution') {
    dependsOn jar
    def archive = jar.archiveFile
    doLast {
        def zip = new java.util.zip.ZipFile(archive.get().asFile)
        try {
            if (zip.getEntry('natives/libeviemod_metal.dylib') == null) {
                throw new GradleException('Build the distributable Metal addon on macOS (arm64 native missing).')
            }
        } finally { zip.close() }
    }
}
