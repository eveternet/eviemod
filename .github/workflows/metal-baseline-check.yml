name: Metal baseline comparison
on:
  push:
    branches: ['codex/metal-tier1-baseline-check']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      MTL_DEBUG_LAYER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build original Metal implementation
        run: ./gradlew :metal-addon:build :metal-addon:verifyDistribution
      - name: Run original Sodium world fixture
        run: |
          mkdir -p metal-addon/run/mods
          python3 - <<'PY'
          import pathlib, shutil
          cache = pathlib.Path.home() / '.gradle/caches/modules-2/files-2.1/maven.modrinth/sodium/mc26.1.2-0.9.2-fabric'
          jars = list(cache.glob('*/*.jar'))
          assert len(jars) == 1, jars
          shutil.copy2(jars[0], 'metal-addon/run/mods/sodium.jar')
          PY
          set -o pipefail
          ./gradlew :metal-addon:runClient -PmetalSmokeTest -PexpectMetal -PmetalWorldTest 2>&1 | tee metal-baseline-sodium.log
          grep -q EVIEMETAL_SODIUM_LIFECYCLE_OK metal-baseline-sodium.log
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metal-baseline-evidence
          path: |
            metal-baseline-sodium.log
            metal-addon/run/sodium-*.png
            metal-addon/build/test-results/test/*.xml
