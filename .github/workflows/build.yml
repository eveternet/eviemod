name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0 (v6)
      - name: Build
        run: ./gradlew build
      - name: Verify independently loadable artifacts
        run: |
          python3 .github/scripts/verify-metal-artifacts.py
          python3 .github/scripts/report-metal-tests.py
      - name: Resolve actual Minecraft 26.2 sources for the final port review
        run: |
          ./gradlew :metal-addon-26.2:genSources --no-daemon
          python3 .github/scripts/report-metal-upstream.py
      - name: Verify both packaged addons preserve vanilla backends on unsupported hosts and explicit disable
        run: |
          set -o pipefail
          for module in metal-addon metal-addon-26.2; do
            timeout 180s xvfb-run -a ./gradlew ":$module:packagedFallbackSmoke" --no-configuration-cache 2>&1 | tee "$module-fallback.log"
            grep -q EVIEMOD_METAL_FALLBACK_OK "$module-fallback.log"
            timeout 180s xvfb-run -a ./gradlew ":$module:packagedDisabledSmoke" --no-configuration-cache 2>&1 | tee "$module-disabled.log"
            grep -q EVIEMOD_METAL_FALLBACK_OK "$module-disabled.log"
            timeout 180s xvfb-run -a ./gradlew ":$module:packagedDisabledSodiumSmoke" --no-configuration-cache 2>&1 | tee "$module-disabled-sodium.log"
            grep -q EVIEMOD_METAL_FALLBACK_OK "$module-disabled-sodium.log"
            grep -q EVIEMETAL_PINNED_SODIUM_OK "$module-disabled-sodium.log"
          done
      - name: Verify disabled Metal preserves 26.2 Vulkan preference
        run: |
          set -o pipefail
          timeout 180s xvfb-run -a ./gradlew :metal-addon-26.2:packagedDisabledVulkanSmoke --no-configuration-cache 2>&1 | tee metal-disabled-vulkan.log
          grep -q 'EVIEMETAL_VANILLA_ORDER_OK preference=vulkan' metal-disabled-vulkan.log
          grep -q EVIEMOD_METAL_FALLBACK_OK metal-disabled-vulkan.log
      - name: Verify 26.1.2 mixins and settings navigation
        run: |
          set -o pipefail
          timeout 180s xvfb-run -a ./gradlew :runClient -PuiSmokeTest -PversionSmokeTest 2>&1 | tee eviemod-26.1.2-smoke.log
          grep -q EVIEMOD_VERSION_SMOKE_OK eviemod-26.1.2-smoke.log
      - name: Verify 26.2 mixins and settings navigation
        run: |
          set -o pipefail
          timeout 180s xvfb-run -a ./gradlew :eviemod-26.2:runClient -PuiSmokeTest -PversionSmokeTest 2>&1 | tee eviemod-26.2-smoke.log
          grep -q EVIEMOD_VERSION_SMOKE_OK eviemod-26.2-smoke.log
      - name: Upload main mod launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eviemod-launch-evidence
          path: |
            eviemod-*-smoke.log
            metal-*.log
            metal-addon*-*.log
            build/metal-upstream-review/
            build/test-results/test/*.xml
            eviemod-26.2/build/test-results/test/*.xml
      - name: Upload 26.1.2 mod JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eviemod-mc26.1.2
          path: |
            build/libs/eviemod-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*-shadow.jar
          if-no-files-found: error
      - name: Upload 26.2 mod JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eviemod-mc26.2
          path: |
            eviemod-26.2/build/libs/eviemod-*-mc26.2.jar
          if-no-files-found: error

  metal:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.1.2'
            module: metal-addon
          - minecraft: '26.2'
            module: metal-addon-26.2
    env:
      MTL_DEBUG_LAYER: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build and test both Metal distributions
        run: ./gradlew build verifyMetalDistributions
      - name: Verify independently loadable versioned artifacts
        run: |
          python3 .github/scripts/verify-metal-artifacts.py
          python3 .github/scripts/report-metal-tests.py
      - name: Verify packaged 26.2 surface clear/present/close
        if: matrix.minecraft == '26.2'
        run: ./gradlew :metal-addon-26.2:packagedSurfaceSmoke
      # Each job owns one display; all graphical fixtures below execute serially.
      - name: Verify packaged vanilla and pinned Sodium title screenshots
        env:
          METAL_MODULE: ${{ matrix.module }}
        run: |
          python3 .github/scripts/verify-metal-fixture.py "$METAL_MODULE" Title
          python3 .github/scripts/verify-metal-fixture.py "$METAL_MODULE" SodiumTitle
      - name: Verify packaged vanilla lifecycle
        env:
          METAL_MODULE: ${{ matrix.module }}
        run: python3 .github/scripts/verify-metal-fixture.py "$METAL_MODULE" Vanilla
      - name: Verify packaged pinned Sodium terrain and lifecycle
        env:
          METAL_MODULE: ${{ matrix.module }}
        run: python3 .github/scripts/verify-metal-fixture.py "$METAL_MODULE" Sodium
      - name: Verify packaged 26.2 unsupported Sodium and native preflight retry
        if: matrix.minecraft == '26.2'
        run: python3 .github/scripts/verify-metal-compatibility.py
      - name: Upload Metal validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: metal-mc${{ matrix.minecraft }}-evidence
          path: |
            metal-*.log
            ${{ matrix.module }}/build/packagedSmoke/**/*.png
            ${{ matrix.module }}/build/packagedSmoke/**/logs/latest.log
            ${{ matrix.module }}/build/test-results/test/*.xml
      - name: Upload Minecraft-specific Metal addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eviemod-metal-mc${{ matrix.minecraft }}
          path: build/distributions/metal/eviemod-metal-mc${{ matrix.minecraft }}-*.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, metal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: eviemod-mc*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: eviemod-metal-mc*
          merge-multiple: true
          path: metal-dist
      - name: Create release with mod JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          jars=(dist/*.jar)
          test "${#jars[@]}" -eq 2
          test -f "${jars[0]}"
          test -f "${jars[1]}"
          test -f dist/*-mc26.1.2.jar
          test -f dist/*-mc26.2.jar
          metal_jars=(metal-dist/*.jar)
          test "${#metal_jars[@]}" -eq 2
          test -f "${metal_jars[0]}"
          gh release create "$RELEASE_TAG" "${jars[@]}" "${metal_jars[@]}" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
