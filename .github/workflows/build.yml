name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0 (v6)
      - name: Build
        run: ./gradlew build
      - name: Verify both mod artifacts
        run: python3 .github/scripts/verify-artifacts.py
      - name: Verify 26.1.2 mixins and settings navigation
        run: |
          set -o pipefail
          timeout 180s xvfb-run -a ./gradlew :runClient -PuiSmokeTest -PversionSmokeTest 2>&1 | tee eviemod-26.1.2-smoke.log
          grep -q EVIEMOD_VERSION_SMOKE_OK eviemod-26.1.2-smoke.log
      - name: Verify 26.2 mixins and settings navigation
        run: |
          set -o pipefail
          timeout 180s xvfb-run -a ./gradlew :eviemod-26.2:runClient -PuiSmokeTest -PversionSmokeTest 2>&1 | tee eviemod-26.2-smoke.log
          grep -q EVIEMOD_VERSION_SMOKE_OK eviemod-26.2-smoke.log
      - name: Upload main mod launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eviemod-launch-evidence
          path: |
            eviemod-*-smoke.log
            build/test-results/test/*.xml
            eviemod-26.2/build/test-results/test/*.xml
      - name: Upload 26.1.2 mod JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eviemod-mc26.1.2
          path: |
            build/libs/eviemod-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*-shadow.jar
          if-no-files-found: error
      - name: Upload 26.2 mod JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eviemod-mc26.2
          path: |
            eviemod-26.2/build/libs/eviemod-*-mc26.2.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: eviemod-mc*
          merge-multiple: true
          path: dist
      - name: Create release with mod JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          jars=(dist/*.jar)
          test "${#jars[@]}" -eq 2
          test -f "${jars[0]}"
          test -f "${jars[1]}"
          test -f dist/*-mc26.1.2.jar
          test -f dist/*-mc26.2.jar
          gh release create "$RELEASE_TAG" "${jars[@]}" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
