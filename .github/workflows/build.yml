name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build
      - name: Verify independently loadable artifacts
        run: python3 .github/scripts/verify-metal-artifacts.py
      - name: Verify addon launches with OpenGL on an unsupported host
        run: |
          xvfb-run -a ./gradlew :metal-addon:runClient -PmetalSmokeTest -Pmetal > metal-smoke.log 2>&1
          cat metal-smoke.log
          grep -q EVIEMOD_METAL_FALLBACK_OK metal-smoke.log
      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: eviemod
          path: |
            build/libs/eviemod-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*-shadow.jar
          if-no-files-found: error

  metal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test Metal addon and native library
        run: ./gradlew :metal-addon:build :metal-addon:verifyDistribution
      - name: Upload Metal addon
        uses: actions/upload-artifact@v7
        with:
          name: eviemod-metal
          path: |
            metal-addon/build/libs/eviemod-metal-*.jar
            !metal-addon/build/libs/*-sources.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, metal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: eviemod
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: eviemod-metal
          path: metal-dist
      - name: Create release with mod JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          jars=(dist/*.jar)
          test "${#jars[@]}" -eq 1
          test -f "${jars[0]}"
          metal_jars=(metal-dist/*.jar)
          test "${#metal_jars[@]}" -eq 1
          test -f "${metal_jars[0]}"
          gh release create "$RELEASE_TAG" "${jars[0]}" "${metal_jars[0]}" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
