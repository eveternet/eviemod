name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0 (v6)
      - name: Build
        run: ./gradlew build
      - name: Verify independently loadable artifacts
        run: python3 .github/scripts/verify-metal-artifacts.py
      - name: Verify addon launches with OpenGL on an unsupported host
        run: |
          set -o pipefail
          xvfb-run -a ./gradlew :metal-addon:runClient -PmetalSmokeTest 2>&1 | tee metal-smoke.log
          grep -q EVIEMOD_METAL_FALLBACK_OK metal-smoke.log
      - name: Verify explicit disable override launches with OpenGL
        run: |
          set -o pipefail
          xvfb-run -a ./gradlew :metal-addon:runClient -PmetalSmokeTest -Pmetal=false 2>&1 | tee metal-disabled-launch.log
          grep -Fq 'Using OpenGL: disabled by -Deviemod.metal override' metal-disabled-launch.log
          grep -q EVIEMOD_METAL_FALLBACK_OK metal-disabled-launch.log
      - name: Verify 26.1.2 mixins and settings navigation
        run: |
          set -o pipefail
          timeout 180s xvfb-run -a ./gradlew :runClient -PuiSmokeTest -PversionSmokeTest 2>&1 | tee eviemod-26.1.2-smoke.log
          grep -q EVIEMOD_VERSION_SMOKE_OK eviemod-26.1.2-smoke.log
      - name: Verify 26.2 mixins and settings navigation
        run: |
          set -o pipefail
          timeout 180s xvfb-run -a ./gradlew :eviemod-26.2:runClient -PuiSmokeTest -PversionSmokeTest 2>&1 | tee eviemod-26.2-smoke.log
          grep -q EVIEMOD_VERSION_SMOKE_OK eviemod-26.2-smoke.log
      - name: Upload main mod launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eviemod-launch-evidence
          path: |
            eviemod-*-smoke.log
            build/test-results/test/*.xml
            eviemod-26.2/build/test-results/test/*.xml
      - name: Upload 26.1.2 mod JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eviemod-mc26.1.2
          path: |
            build/libs/eviemod-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*-shadow.jar
          if-no-files-found: error
      - name: Upload 26.2 mod JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eviemod-mc26.2
          path: |
            eviemod-26.2/build/libs/eviemod-*-mc26.2.jar
          if-no-files-found: error

  metal:
    # Branch compilation runs on every push; avoid duplicate Mac jobs for the same open PR.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 15
    env:
      MTL_DEBUG_LAYER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test Metal addon and native library
        run: ./gradlew :metal-addon:build :metal-addon:verifyDistribution
      - name: Render and read back a Minecraft frame using Metal
        run: |
          set -o pipefail
          ./gradlew :metal-addon:runClient -PmetalSmokeTest -PexpectMetal 2>&1 | tee metal-launch.log
          grep -q EVIEMOD_METAL_FRAME_OK metal-launch.log
      - name: Verify Sodium terrain reuse, binding savings and world cleanup
        run: |
          mkdir -p metal-addon/run/mods
          python3 - <<'PY'
          import pathlib, shutil
          cache = pathlib.Path.home() / '.gradle/caches/modules-2/files-2.1/maven.modrinth/sodium/mc26.1.2-0.9.2-fabric'
          jars = list(cache.glob('*/*.jar'))
          assert len(jars) == 1, jars
          shutil.copy2(jars[0], 'metal-addon/run/mods/sodium.jar')
          PY
          set -o pipefail
          ./gradlew :metal-addon:runClient -PmetalSmokeTest -PexpectMetal -PmetalWorldTest -PterrainProfile 2>&1 | tee metal-sodium-launch.log
          grep -q EVIEMETAL_SODIUM_TIER1_OK metal-sodium-launch.log
          grep -q EVIEMETAL_SODIUM_LIFECYCLE_OK metal-sodium-launch.log
      - name: Upload Metal launch evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metal-launch-evidence
          path: |
            metal-launch.log
            metal-sodium-launch.log
            metal-addon/run/sodium-*.png
            metal-addon/run/metal-smoke.png
            metal-addon/build/test-results/test/*.xml
      - name: Upload Metal addon
        uses: actions/upload-artifact@v7
        with:
          name: eviemod-metal
          path: |
            metal-addon/build/libs/eviemod-metal-*.jar
            !metal-addon/build/libs/*-sources.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, metal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: eviemod-mc*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: eviemod-metal
          path: metal-dist
      - name: Create release with mod JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          jars=(dist/*.jar)
          test "${#jars[@]}" -eq 2
          test -f "${jars[0]}"
          test -f "${jars[1]}"
          test -f dist/*-mc26.1.2.jar
          test -f dist/*-mc26.2.jar
          metal_jars=(metal-dist/*.jar)
          test "${#metal_jars[@]}" -eq 1
          test -f "${metal_jars[0]}"
          gh release create "$RELEASE_TAG" "${jars[@]}" "${metal_jars[0]}" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
