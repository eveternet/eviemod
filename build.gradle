plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

group = 'dev.eviemod'
version = '1.5.0.1'

ext {
    minecraftVersion = '26.3'
    fabricApiVersion = '0.167.0+26.3'
    yaclVersion = '3.9.7+26.3'
    dandelionVersion = '1.0.0-alpha.23+26.3'
    dandelionCoordinate = "net.azureaaron:dandelion:${dandelionVersion}"
    hmApiVersion = '1.0.5+26.3'
    modMenuVersion = '21.0.1'
}
apply from: 'gradle/eviemod.gradle'

// An explicit root build also builds the second supported Minecraft target.
tasks.named('build') { dependsOn ':eviemod-26.2:build' }
