plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

group = 'dev.eviemod'
version = '1.3.1.0'

ext {
    minecraftVersion = '26.1.2'
    fabricApiVersion = '0.155.2+26.1.2'
    yaclVersion = '3.9.2+26.1'
    dandelionVersion = '1.0.0-alpha.21+26.1'
    dandelionCoordinate = "local.eviemod:dandelion:${dandelionVersion}"
    hmApiVersion = '1.0.3+26.1'
    modMenuVersion = '18.0.1'
}
apply from: 'gradle/eviemod.gradle'

// An explicit root build also builds the second supported Minecraft target.
tasks.named('build') { dependsOn ':eviemod-26.2:build' }

// Both fixed Minecraft adapters are first-class build targets.
tasks.named('build') { dependsOn ':metal-addon:build', ':metal-addon-26.2:build' }
tasks.register('verifyMetalDistributions') { dependsOn ':metal-addon:verifyDistribution', ':metal-addon-26.2:verifyDistribution' }

// Sync keeps the aggregate directory free of stale addon versions after a version bump.
tasks.register('metalDistributions', Sync) {
    dependsOn ':metal-addon:jar', ':metal-addon-26.2:jar'
    into layout.buildDirectory.dir('distributions/metal')
    from project(':metal-addon').tasks.named('jar', Jar).flatMap { it.archiveFile }
    from project(':metal-addon-26.2').tasks.named('jar', Jar).flatMap { it.archiveFile }
}
tasks.named('build') { dependsOn 'metalDistributions' }
tasks.register('verifyPackagedMetal') {
    dependsOn ':metal-addon:packagedVanillaSmoke', ':metal-addon:packagedSodiumSmoke',
            ':metal-addon-26.2:packagedSurfaceSmoke', ':metal-addon-26.2:packagedVanillaSmoke', ':metal-addon-26.2:packagedSodiumSmoke'
}
