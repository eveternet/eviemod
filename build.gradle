plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

group = 'dev.eviemod'
version = '1.3.1.0'

ext {
    minecraftVersion = '26.1.2'
    fabricApiVersion = '0.155.2+26.1.2'
    yaclVersion = '3.9.2+26.1'
    dandelionVersion = '1.0.0-alpha.21+26.1'
    dandelionCoordinate = "local.eviemod:dandelion:${dandelionVersion}"
    hmApiVersion = '1.0.3+26.1'
    modMenuVersion = '18.0.1'
}
apply from: 'gradle/eviemod.gradle'

// An explicit root build also builds the second supported Minecraft target.
tasks.named('build') { dependsOn ':eviemod-26.2:build' }
